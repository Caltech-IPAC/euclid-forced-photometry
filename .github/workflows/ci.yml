name: CI

on:
  push:
  pull_request:

jobs:
  install-and-smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (package, Tractor, astrometry.net, unwise_psf)
        run: ./scripts/install.sh --wise --python "$(which python)"

      - name: Lint (pyflakes)
        run: |
          python -m pip install pyflakes
          python -m pyflakes src scripts

      - name: Public API imports
        run: |
          python -c "
          import euclid_phot as ep
          missing = [n for n in ep.__all__ if not hasattr(ep, n)]
          assert not missing, missing
          from euclid_phot import euclid, forced, ground_based, irac, selection, wise
          print(len(ep.__all__), 'public names import')
          "
          euclid-phot run --help > /dev/null

      - name: Forced photometry on a synthetic image (offline)
        run: |
          python -c "
          import numpy as np
          from astropy.wcs import WCS
          from tractor import NanoMaggies, PointSource, RaDecPos
          from euclid_phot import forced
          from euclid_phot.sources import clone_sources
          from euclid_phot.tractor_image import make_tractor_image
          from euclid_phot.units import UJY_PER_NMGY

          # 64x64 image, 0.4 arcsec pixels, Gaussian PSF, two point sources.
          wcs = WCS(naxis=2)
          wcs.wcs.ctype = ['RA---TAN', 'DEC--TAN']
          wcs.wcs.crval = [150.0, 2.0]
          wcs.wcs.crpix = [32.5, 32.5]
          wcs.wcs.cdelt = [-0.4 / 3600, 0.4 / 3600]
          yy, xx = np.mgrid[-12:13, -12:13]
          psf = np.exp(-(xx**2 + yy**2) / (2 * 2.0**2))
          truth = {(20.3, 30.1): 50.0, (40.7, 35.4): 20.0}   # pixel -> uJy
          data = np.zeros((64, 64))
          y, x = np.mgrid[:64, :64]
          for (px, py), flux in truth.items():
              data += flux * np.exp(-((x - px)**2 + (y - py)**2) / 8.0) / (8.0 * np.pi)
          rng = np.random.default_rng(1)
          sigma = 0.01
          data += rng.normal(0, sigma, data.shape)
          priors = [PointSource(RaDecPos(*wcs.pixel_to_world_values(px, py)),
                                NanoMaggies(VIS=1.0)) for px, py in truth]

          tim = make_tractor_image(data, np.full(data.shape, sigma**-2), wcs, psf,
                                   band='X', nmgy_to_data=UJY_PER_NMGY)
          sources = clone_sources(priors, 'X')
          for optimizer in ('lsqr', 'scaled', 'constrained'):
              tractor = forced.flux_tractor(tim, sources, optimizer=optimizer)
              result = forced.solve_fluxes(tractor)
              flux = forced.fluxes_ujy(sources, 'X')
              err = forced.flux_errors_ujy(
                  forced.flux_inverse_variance(result, tractor, len(sources)))
              pull = (flux - np.array(list(truth.values()))) / err
              print(optimizer, flux.round(3), err.round(4), pull.round(2))
              assert np.all(np.abs(pull) < 5), pull
          "
