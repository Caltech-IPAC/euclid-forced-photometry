# Jupyter Book (MyST) configuration. The site is built from the notebooks
# as committed, with their saved outputs; nothing is executed at build time.
version: 1
project:
  title: Euclid forced photometry
  github: https://github.com/NimaChartab/euclid-forced-photometry
  exclude:
    - .anet/**
    - .unwise_psf/**
    - examples/**
    - src/**
    - scripts/**
  toc:
    - file: README.md
    - title: Notebooks
      children:
        - file: notebooks/00_how_tractor_works.ipynb
        - file: notebooks/01_nisp_forced_photometry.ipynb
        - file: notebooks/02_wise_forced_photometry.ipynb
        - file: notebooks/03_irac_forced_photometry.ipynb
        - file: notebooks/04_ground_based_forced_photometry.ipynb
        - file: notebooks/05_one_call.ipynb
        - file: notebooks/06_photometry_at_coordinates.ipynb
    - title: Supporting notebooks
      children:
        - file: notebooks/supporting_notebooks/model_selection.ipynb
        - file: notebooks/supporting_notebooks/injection_recovery.ipynb
site:
  template: book-theme
  options:
    folders: true
